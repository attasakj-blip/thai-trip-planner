name: Publish trip data

# Every Wednesday 0:00 Thai time (= Tuesday 17:00 UTC), and whenever the data files change.
on:
  schedule:
    - cron: "0 17 * * 2"
  push:
    branches: [main]
    paths:
      - app/src/main/assets/places.json
      - app/src/main/assets/hubs.json
      - scripts/publish_data.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and build data files
        run: python3 scripts/publish_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
