name: POI test
on:
  push:
    branches: [coordcheck]
    paths: [poitest/scripts/build_pois.py]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && pip install -q osmium
      - run: curl -sSL -o th.pbf https://download.geofabrik.de/asia/thailand-latest.osm.pbf && ls -la th.pbf
      - run: osmium tags-filter th.pbf nwr/amenity=restaurant,food_court,cafe,hospital,clinic,doctors,police,fire_station nwr/healthcare=hospital,clinic -o pois.osm.pbf && ls -la pois.osm.pbf
      - run: cd poitest && time python3 scripts/build_pois.py ../pois.osm.pbf 2>&1 | tee ../data/poitest_log.txt
      - run: |
          mkdir -p data/poisample; cp poitest/site/data/v1/pois/index.json poitest/site/data/v1/pois/grand_palace.json poitest/site/data/v1/pois/pattaya.json data/poisample/ || true
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/poitest_log.txt data/poisample; git commit -m "poi test"; git pull --rebase; git push
