name: Rail fetch
on:
  push:
    branches: [coordcheck]
    paths: [rail.py, rail2.py]
permissions:
  contents: write
jobs:
  rail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 rail.py; python3 rail2.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/bkk_rail_raw.json data/bkk_stations_raw.json; git commit -m "rail data"; git pull --rebase; git push
