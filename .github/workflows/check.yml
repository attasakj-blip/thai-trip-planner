name: Coordinate check
on:
  push:
    branches: [coordcheck]
    paths: [data/places.json, check.py]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/result.json; git commit -m "coordinate check result"; git push
