name: Probe
on:
  push:
    branches: [coordcheck]
    paths: [probe.py]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/probe.txt; git commit -m probe; git pull --rebase; git push
