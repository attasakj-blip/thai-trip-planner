name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiTripPlanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Name the APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk ThaiTrip.apk
      # A fixed link to the newest APK that opens straight on a phone:
      # https://github.com/attasakj-blip/thai-trip-planner/releases/latest/download/ThaiTrip.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: latest-build
          name: Thai Trip Planner (latest test build)
          body: APK ล่าสุดจาก commit ${{ github.sha }}
          files: ThaiTrip.apk
          make_latest: true
